<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منو</title>
<script>try{var t=localStorage.th;if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--brand:#0F6B5C;--on:#fff;--bg:#F6F7F5;--ink:#1B2421;--mute:#68726E;--line:#E3E7E4}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 20px 16px;gap:4px}
.hero img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--card);border:1px solid var(--line)}
.hero h1{margin:6px 0 0;font-size:24px;font-weight:800}
.hero p{margin:0;color:var(--mute);font-size:14px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;scroll-snap-type:x proximity}
nav::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:center;padding:5px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:14px;transition:background .2s,color .2s}
.chip.on{background:var(--brand);color:var(--on);border-color:var(--brand);font-weight:700}
main{max-width:720px;margin:0 auto;padding:0 16px 24px}
section{scroll-margin-top:70px;padding-top:22px}
h2{margin:0 0 4px;font-size:19px;font-weight:800;color:var(--bt)}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item h3{margin:0;font-size:15px;font-weight:700}
.item .d{margin:0;font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .p{margin-top:2px;font-size:14px;font-weight:700}
.item img{width:92px;height:92px;border-radius:12px;object-fit:cover;flex:none;background:#e9ecea}
.item.off{opacity:.5}
.off-tag{font-size:12px;color:#B3261E;margin-inline-start:6px}
dialog{border:0;border-radius:18px;padding:0;width:min(92vw,420px);max-height:90vh;overflow:auto;color:var(--ink);background:var(--card);font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
dialog .b{padding:14px 18px 18px}
dialog h3{margin:0;font-size:18px}
dialog p{margin:6px 0;color:var(--mute);font-size:14px}
dialog button{margin-top:8px;width:100%;padding:10px;border:0;border-radius:12px;background:var(--brand);color:var(--on);font:inherit;font-weight:700}
footer{background:var(--card);border-top:1px solid var(--line);padding:24px 16px 40px}
footer .in{max-width:720px;margin:0 auto;display:grid;gap:10px;font-size:14px}
footer h4{margin:0;font-size:17px}
footer a{color:var(--bt);text-decoration:none;font-weight:700}
footer .row{display:flex;gap:8px}
footer .row b{flex:none;color:var(--mute);font-weight:400}
footer iframe{width:100%;height:210px;border:0;border-radius:14px;background:#e9ecea}
.btn{display:inline-block;padding:9px 18px;border-radius:12px;background:var(--brand);color:var(--on)!important;text-align:center}
.note{background:var(--bg);border-radius:12px;padding:10px 14px;text-align:center;color:var(--mute)}
:root{--card:#fff;--bt:var(--brand);--gold:#E0A100}
:root[data-theme=dark]{--bg:#121614;--ink:#ECF0ED;--mute:#9AA5A0;--line:#2A322E;--card:#1B211E;--bt:color-mix(in srgb,var(--brand) 55%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121614;--ink:#ECF0ED;--mute:#9AA5A0;--line:#2A322E;--card:#1B211E;--bt:color-mix(in srgb,var(--brand) 55%,#fff)}}
.hero{position:relative}
.thb{position:absolute;top:10px;left:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 12px;font:inherit;font-size:12px;cursor:pointer}
.q{margin-top:6px;display:flex;align-items:center;gap:8px}
.q button{margin:0;width:auto;border:1px solid var(--brand);background:var(--card);color:var(--bt);border-radius:999px;min-width:34px;height:34px;padding:0 12px;font:inherit;font-weight:700;cursor:pointer}
.q button.f{background:var(--brand);color:var(--on)}
.q span{min-width:20px;text-align:center;font-weight:700}
#bar{position:fixed;left:12px;right:12px;bottom:12px;margin:0 auto;max-width:696px;z-index:8;display:none;justify-content:space-between;align-items:center;background:var(--brand);color:var(--on);border:0;border-radius:16px;padding:14px 18px;font:inherit;font-weight:800;box-shadow:0 6px 24px rgba(0,0,0,.25);cursor:pointer}
#bar.on{display:flex}
body.hasbar{padding-bottom:84px}
.ln{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ln b{flex:1;font-weight:600;font-size:14px}.ln .q{margin:0}
dialog .b input,dialog .b textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);margin-top:4px}
dialog .b label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
dialog button.g{background:none;color:var(--mute);font-weight:400}
.stars{display:flex;gap:4px}
.stars button{margin:0;width:auto;background:none;color:var(--line);font-size:34px;line-height:1;padding:0 2px}
.stars button.on{color:var(--gold)}
.err{color:#B3261E;font-size:13px;margin-top:6px}
.sm{font-size:12px;color:var(--mute)}
a:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<dialog id="ord"></dialog>
<button id="bar" onclick="cartSheet()"></button>
<script>
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e[x]=v;else if(v!==false&&v!=null)e.setAttribute(x,v)}for(const c of k.flat())e.append(c===false||c==null?'':c);return e};
const idb=(m,k,v)=>new Promise((res,rej)=>{const o=indexedDB.open('menu-kit',1);o.onupgradeneeded=()=>o.result.createObjectStore('s');o.onsuccess=()=>{const t=o.result.transaction('s',m),st=t.objectStore('s'),r=m==='readwrite'?st.put(v,k):st.get(k);t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)};o.onerror=()=>rej(o.error)});
const money=n=>n===''||n==null?'':Number(n).toLocaleString('fa-IR')+' تومان';

const textOn=h=>{const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(r*299+g*587+b*114)/1000>150?'#1B2421':'#fff'};

(async()=>{
  let D;
  if(location.search.includes('preview')){try{D=await idb('readonly','draft')}catch{}}
  if(!D){try{D=await(await fetch('data/menu.json',{cache:'no-cache'})).json()}catch{}}
  if(!D){$('#app').textContent='منو در دسترس نیست.';return}
  render(D);
})();

function render(D){
  const I=D.info||{},brand=I.brand||'#0F6B5C',app=$('#app');
  ORD=I.orderUrl||'';(D.items||[]).forEach(i=>ITEMS[i.id]=i);
  document.title=I.name||'منو';
  document.documentElement.style.setProperty('--brand',brand);
  document.documentElement.style.setProperty('--on',textOn(brand));
  const cats=(D.categories||[]).filter(c=>(D.items||[]).some(i=>i.cat===c.id));

  app.append(el('header',{class:'hero'},themeBtn(),I.logo&&el('img',{src:I.logo,alt:''}),el('h1',{},I.name||''),I.tagline&&el('p',{},I.tagline)));

  const nav=el('nav',{'aria-label':'دسته‌بندی'}),main=el('main');
  cats.forEach(c=>{
    nav.append(el('a',{class:'chip',href:'#c-'+c.id,'data-id':c.id},c.name));
    const sec=el('section',{id:'c-'+c.id},el('h2',{},c.name));
    D.items.filter(i=>i.cat===c.id).forEach(i=>{
      const t=el('div',{class:'t'},el('h3',{},i.name,i.off&&el('span',{class:'off-tag'},'ناموجود')),i.desc&&el('p',{class:'d'},i.desc),i.price!==''&&i.price!=null&&el('div',{class:'p'},money(i.price)));
      if(ORD&&!i.off)t.append(ctl(i));
      const row=el('div',{class:'item'+(i.off?' off':''),onclick:()=>open(i)},t,i.img&&el('img',{src:i.img,alt:i.name,loading:'lazy'}));
      sec.append(row);
    });
    main.append(sec);
  });
  app.append(nav,main,footer(I));

  const chips=[...nav.children],secs=[...main.children];
  let cur=null;
  const spy=()=>{
    const y=nav.offsetHeight+30;let s=secs[0];
    for(const x of secs)if(x.getBoundingClientRect().top<=y)s=x;
    if(!s||s===cur)return;cur=s;
    chips.forEach(c=>{const on=c.dataset.id===s.id.slice(2);c.classList.toggle('on',on);if(on)c.scrollIntoView({inline:'center',block:'nearest'})});
  };
  nav.addEventListener('click',e=>{
    const a=e.target.closest('a');if(!a)return;e.preventDefault();
    const s=$('#c-'+a.dataset.id);
    scrollTo({top:s.getBoundingClientRect().top+scrollY-nav.offsetHeight-6,behavior:'smooth'});
  });
  addEventListener('scroll',spy,{passive:true});spy();
}


/* ---------- theme / order / rating ---------- */
const en=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const TL={auto:'خودکار',light:'روشن',dark:'تاریک'};
function themeBtn(){
  let t;try{t=localStorage.th}catch{}t=t||'auto';
  const b=el('button',{class:'thb','aria-label':'تغییر تم'},'◐ '+TL[t]);
  b.onclick=()=>{t={auto:'light',light:'dark',dark:'auto'}[t];const r=document.documentElement;t==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=t;try{localStorage.th=t}catch{}b.textContent='◐ '+TL[t]};
  return b;
}
let ORD='',CART={},ITEMS={},redraws={},FORM={t:new URLSearchParams(location.search).get('t')||'',n:''};
const total=()=>Object.entries(CART).reduce((s,[id,q])=>s+(+ITEMS[id].price||0)*q,0);
const nf=n=>n.toLocaleString('fa-IR');
function bar(){
  const n=Object.values(CART).reduce((a,b)=>a+b,0),b=$('#bar');
  b.classList.toggle('on',n>0);document.body.classList.toggle('hasbar',n>0);
  b.replaceChildren(el('span',{},'مشاهده سفارش ('+nf(n)+')'),el('span',{},money(total())));
}
function chg(id,d){
  const n=Math.max(0,Math.min(20,(CART[id]||0)+d));n?CART[id]=n:delete CART[id];
  redraws[id]&&redraws[id]();bar();if($('#ord').open)cartSheet();
}
function stepper(id,redraw){
  const n=CART[id]||0;
  return n?[el('button',{onclick:()=>chg(id,-1),'aria-label':'کم'},'−'),el('span',{},nf(n)),el('button',{class:'f',onclick:()=>chg(id,1),'aria-label':'زیاد'},'+')]:[el('button',{class:'f',onclick:()=>chg(id,1)},'+ افزودن')];
}
function ctl(i){
  const q=el('div',{class:'q',onclick:e=>e.stopPropagation()});
  const draw=()=>q.replaceChildren(...stepper(i.id));redraws[i.id]=draw;draw();return q;
}
async function post(data){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),12000);
  try{await fetch(ORD,{method:'POST',mode:'no-cors',body:JSON.stringify(data),signal:c.signal});return true}catch{return false}finally{clearTimeout(to)}
}
function cartSheet(){
  const d=$('#ord'),ids=Object.keys(CART);
  if(!ids.length){d.close();return}
  const t=el('input',{placeholder:'مثلاً ۵',value:FORM.t});t.oninput=()=>FORM.t=t.value;
  const n=el('textarea',{rows:2,placeholder:'مثلاً بدون شکر'});n.value=FORM.n;n.oninput=()=>FORM.n=n.value;
  const err=el('div',{class:'err'}),go=el('button',{},'ارسال سفارش به گارسون');
  go.onclick=async()=>{
    const tb=FORM.t.trim();if(!tb){err.textContent='شماره میز را بنویسید';t.focus();return}
    let last=0;try{last=+localStorage.lo||0}catch{}
    if(Date.now()-last<30000){err.textContent='چند لحظه صبر کنید و دوباره بزنید';return}
    go.disabled=true;go.textContent='در حال ارسال…';err.textContent='';
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const ok=await post({type:'order',id,table:tb,note:FORM.n.trim(),total:total(),items:ids.map(k=>({n:ITEMS[k].name,q:CART[k],p:+ITEMS[k].price||0}))});
    if(!ok){go.disabled=false;go.textContent='ارسال سفارش به گارسون';err.textContent='ارسال نشد. اینترنت را بررسی کنید یا سفارش را به گارسون بگویید.';return}
    try{localStorage.lo=Date.now()}catch{}
    CART={};FORM.n='';Object.values(redraws).forEach(f=>f());bar();rateView(d,id);
  };
  d.replaceChildren(el('div',{class:'b'},el('h3',{},'سفارش شما'),
    ...ids.map(id=>el('div',{class:'ln'},el('b',{},ITEMS[id].name),el('div',{class:'q'},...stepper(id)))),
    el('p',{style:'font-weight:700;color:var(--ink)'},'جمع: '+money(total())),
    el('label',{},'شماره میز'),t,el('label',{},'توضیح (اختیاری)'),n,err,go,el('button',{class:'g',onclick:()=>d.close()},'ادامه انتخاب')));
  if(!d.open)d.showModal();d.onclick=e=>{if(e.target===d)d.close()};
}
function rateView(d,oid){
  const R={s:0,a:0};
  const go=el('button',{disabled:true},'ثبت نظر');
  const chk=()=>go.disabled=!(R.s||R.a);
  const stars=k=>{const w=el('div',{class:'stars'});const draw=()=>w.replaceChildren(...[1,2,3,4,5].map(v=>el('button',{class:v<=R[k]?'on':'','aria-label':v+' ستاره',onclick:()=>{R[k]=v;draw();chk()}},'★')));draw();return w};
  const c=el('textarea',{rows:2,placeholder:'نظر یا پیشنهاد شما (اختیاری)'});
  const ph=el('input',{type:'tel',inputmode:'tel',dir:'ltr',placeholder:'09…'});
  go.onclick=async()=>{go.disabled=true;go.textContent='…';
    await post({type:'rating',orderId:oid||'',service:R.s,ambience:R.a,comment:c.value.trim(),phone:en(ph.value).replace(/\D/g,'')});
    d.replaceChildren(el('div',{class:'b'},el('h3',{},'ممنون از شما 🙏'),el('button',{onclick:()=>d.close()},'بستن')));
  };
  d.replaceChildren(el('div',{class:'b'},
    oid?el('h3',{},'سفارش شما ثبت شد ✅'):el('h3',{},'نظر شما'),
    oid&&el('p',{},'گارسون به‌زودی سفارش را می‌آورد.'),
    el('label',{},'خدمات کافه'),stars('s'),el('label',{},'فضا و محیط'),stars('a'),
    el('label',{},'نظر (اختیاری)'),c,
    el('label',{},'شماره تماس (اختیاری)'),ph,el('div',{class:'sm'},'برای دریافت پیشنهادهای ویژه کافه؛ ثبت آن الزامی نیست.'),
    go,el('button',{class:'g',onclick:()=>d.close()},oid?'الان نه':'بستن')));
  if(!d.open)d.showModal();d.onclick=e=>{if(e.target===d)d.close()};
}

function open(i){
  const d=$('#dlg');d.replaceChildren(i.img&&el('img',{src:i.img,alt:i.name}),el('div',{class:'b'},el('h3',{},i.name),i.desc&&el('p',{},i.desc),i.price!==''&&i.price!=null&&el('p',{style:'color:var(--ink);font-weight:700'},money(i.price)),el('button',{onclick:()=>d.close()},'بستن')));
  d.showModal();d.onclick=e=>{if(e.target===d)d.close()};
}

function footer(I){
  const rows=[];
  const row=(k,v)=>el('div',{class:'row'},el('b',{},k),v);
  if(I.address)rows.push(row('آدرس',I.address));
  if(I.hours)rows.push(row('ساعت کار',I.hours));
  if(I.phone)rows.push(row('تلفن',el('a',{href:'tel:'+I.phone,dir:'ltr'},I.phone)));
  if(I.instagram){const h=I.instagram.replace(/^@/,'');rows.push(row('اینستاگرام',el('a',{href:/instagram\.com/.test(h)?h:'https://instagram.com/'+h,target:'_blank',rel:'noopener',dir:'ltr'},/instagram\.com/.test(h)?'مشاهده صفحه':'@'+h)))}
  const lat=parseFloat(I.mapLat),lng=parseFloat(I.mapLng),has=!isNaN(lat)&&!isNaN(lng);
  const link=I.mapLink||(has?`https://www.google.com/maps?q=${lat},${lng}`:'');
  const map=has&&el('iframe',{loading:'lazy',title:'نقشه',src:`https://www.openstreetmap.org/export/embed.html?bbox=${lng-.004},${lat-.002},${lng+.004},${lat+.002}&layer=mapnik&marker=${lat},${lng}`});
  return el('footer',{},el('div',{class:'in'},el('h4',{},I.name||''),...rows,map,link&&el('a',{class:'btn',href:link,target:'_blank',rel:'noopener'},'مسیریابی'),ORD&&el('button',{class:'btn',style:'border:0;font:inherit;cursor:pointer',onclick:()=>rateView($('#ord'),null)},'ثبت نظر شما'),I.note&&el('div',{class:'note'},I.note)));
}
</script>
</body>
</html>
